name: Deploy Preview

on:
  pull_request:
    branches: [ dev ]  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend


    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Clean install
        run: npm ci
        
      - name: Check with linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Audit npm packages for vulnerabilities
        run: npm audit
        
      - name: Build the app
        run: npm run build

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
